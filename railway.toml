# Default for GitHub → service zeleny-api (repo-linked).
# green-route-web overrides via RAILWAY_DOCKERFILE_PATH=deploy/web/Dockerfile
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/api/Dockerfile"

[deploy]
startCommand = "node index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
