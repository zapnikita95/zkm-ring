server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Геолокация в браузере (иначе некоторые браузеры режут)
  add_header Permissions-Policy "geolocation=(self), gyroscope=(), accelerometer=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = / {
    try_files /site/index.html =404;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    try_files /sitemap.xml =404;
    default_type application/xml;
  }

  location /about {
    try_files /site/about.html =404;
  }

  # SEO landings (static HTML in public/)
  location = /zelenoe-kolco-moskvy {
    try_files /zelenoe-kolco-moskvy.html =404;
  }
  location = /velo-moskva {
    try_files /velo-moskva.html =404;
  }
  location = /peshkom {
    try_files /peshkom.html =404;
  }
  location /gorod/ {
    try_files $uri $uri.html $uri/ =404;
  }
  location /marshrut/ {
    try_files $uri $uri.html $uri/ =404;
  }

  location = /stats {
    return 302 /api/admin/stats.html$is_args$args;
  }

  location /site/ {
    try_files $uri $uri/ /site/index.html;
  }

  location = /app {
    return 302 /app/;
  }
  location = /app/ {
    try_files /index.html =404;
  }

  location /data/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # API на том же контейнере (node :8787)
  location /api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Guest-Token $http_x_guest_token;
    proxy_set_header X-Bot-Secret $http_x_bot_secret;
    proxy_set_header X-Telegram-Id $http_x_telegram_id;
    client_max_body_size 16m;
    proxy_read_timeout 90s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /downloads/ {
    add_header Cache-Control "public, max-age=120";
    add_header Content-Disposition 'attachment' always;
    types { application/vnd.android.package-archive apk; }
    default_type application/vnd.android.package-archive;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
